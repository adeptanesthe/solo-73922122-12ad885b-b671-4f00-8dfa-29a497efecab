<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>敏感证据交接</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="card">
  <h1>敏感证据交接</h1>
  <p class="muted">应急响应证据的限时、单浏览器绑定交接。链接与下载会话的秘密仅以哈希形式入库。</p>
  <div class="actions">
    <a class="btn primary" href="/send">发送证据</a>
    <a class="btn" href="#receive-jump" id="receiveJump">我有接收链接</a>
  </div>
  <form id="receive-jump" class="inline-form" onsubmit="return jump(event)">
    <input type="text" id="linkInput" placeholder="粘贴完整接收链接或令牌" autocomplete="off" spellcheck="false">
    <button class="btn" type="submit">打开</button>
  </form>
  <ul class="notes">
    <li>单文件上限 <strong>16 MiB</strong>，上传与下载全程分块处理，不在服务端整文件缓冲。</li>
    <li>链接 <strong>10 分钟</strong>内有效；仅点击“领取”才绑定当前浏览器的随机 HttpOnly 会话。</li>
    <li>同一链接并发领取只有一个浏览器成功；领取后续传窗口另计 <strong>10 分钟</strong>，支持单段 Range 断点续传。</li>
    <li>未领取链接或续传会话到期后，系统自动清理证据文件。</li>
  </ul>
</main>
<script>
function jump(ev) {
  ev.preventDefault();
  const raw = document.getElementById('linkInput').value.trim();
  if (!raw) return false;
  let token = raw;
  const m = raw.match(/\/receive\/([A-Za-z0-9_\-]+)/);
  if (m) token = m[1];
  location.href = '/receive/' + encodeURIComponent(token);
  return false;
}
</script>
</body>
</html>
