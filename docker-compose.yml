services:
  web1:
    build: .
    container_name: handoff-web1
    environment:
      HANDOFF_DATA_DIR: /data
    volumes:
      - handoff-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web2:
    build: .
    container_name: handoff-web2
    environment:
      HANDOFF_DATA_DIR: /data
    volumes:
      - handoff-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    image: nginx:1.27-alpine
    container_name: handoff-gateway
    depends_on:
      - web1
      - web2
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  handoff-data:
